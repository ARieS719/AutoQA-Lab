# ============================================================================
# pyproject.toml - Project engineering config (pytest + ruff)
#
# NOTE: Keep this file pure ASCII. Tools (pytest / ruff / locust) parse it
# independently; locust reads it with the system default encoding, so CJK
# comments here would crash on a Windows GBK console.
# ============================================================================

[tool.pytest.ini_options]
# Collect tests/ only: never pick up examples/healing_demo demo scripts or venv
testpaths = ["tests"]
norecursedirs = ["venv", "examples", ".hypothesis", "htmlcov", "logs", "report"]
addopts = "-ra --strict-markers"
console_output_style = "progress"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "htmlcov", "report", ".hypothesis"]

[tool.ruff.lint]
# Conservative but effective rules: E/W (pycodestyle) + F (pyflakes) + I (isort)
select = ["E", "W", "F", "I"]
# E501: CJK comments in source files naturally overflow line length
# E402: ai_agent/*.py inject the project root into sys.path before importing
#       config, so direct execution (python ai_agent/xxx.py) also works
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
# Project modules grouped as first-party for stable import sorting
known-first-party = ["config", "mock_server", "tests", "ai_agent"]
# Pin section order and blank lines between groups explicitly, so local runs
# and CI always agree regardless of ruff version defaults
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-between-types = 1
