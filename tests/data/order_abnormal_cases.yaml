- case_title: "边界值校验：购买数量为0 (下界违规)"
  payload:
    item_name: "QA_AUTO_工业级传感器V2"
    qty: 0
  expected_status: 422
  expected_msg: "参数校验失败"

- case_title: "边界值校验：购买数量超过最大上限 10000 (上界违规)"
  payload:
    item_name: "QA_AUTO_工业级传感器V2"
    qty: 10001
  expected_status: 422
  expected_msg: "参数校验失败"

- case_title: "无效等价类：购买数量为负数 (-5)"
  payload:
    item_name: "QA_AUTO_工业级传感器V2"
    qty: -5
  expected_status: 422
  expected_msg: "参数校验失败"

- case_title: "无效等价类：商品名称为空字符串"
  payload:
    item_name: ""
    qty: 2
  expected_status: 422
  expected_msg: "参数校验失败"

- case_title: "必填项缺失：缺少必填字段 qty"
  payload:
    item_name: "QA_AUTO_工业级传感器V2"
  expected_status: 422
  expected_msg: "参数校验失败"

- case_title: "类型异常：qty 传入非法字符串"
  payload:
    item_name: "QA_AUTO_工业级传感器V2"
    qty: "十个"
  expected_status: 422
  expected_msg: "参数校验失败"